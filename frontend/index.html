<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FloorIA - Analyse Architecturale IA</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #1e1e1e;
            color: #cccccc;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Professional Architecture Tool Layout */
        .app-container {
            display: flex;
            height: 100vh;
            background: #1e1e1e;
        }
        
        /* Top Header Bar */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: #3c3c3c;
            border-bottom: 1px solid #464647;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }
        
        .header-bar .logo {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 400;
            color: #cccccc;
        }
        
        .header-bar .project-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.8rem;
            color: #969696;
        }

        /* Main Canvas Area - No Left Sidebar */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 35px;
            margin-bottom: 22px;
            background: #1e1e1e;
        }
        
        /* Toolbar */
        .toolbar {
            height: 35px;
            background: #2d2d30;
            border-bottom: 1px solid #464647;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 8px;
        }
        
        /* Canvas Container - Much Larger */
        .canvas-workspace {
            flex: 1;
            position: relative;
            background: #1e1e1e;
            overflow: hidden;
        }
        
        /* Right Properties Panel */
        .sidebar-right {
            width: 350px;
            background: #252526;
            border-left: 1px solid #464647;
            margin-top: 35px;
            margin-bottom: 22px;
            overflow-y: auto;
        }
        
        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 22px;
            background: #007acc;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 0.75rem;
            z-index: 1000;
        }
        
        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .footer-center {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.7rem;
        }
        
        .footer-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
        }
        
        .model-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .model-metrics {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.9;
        }
        
        .metric {
            background: rgba(255,255,255,0.15);
            padding: 1px 4px;
            border-radius: 2px;
            font-size: 0.65rem;
        }

        /* Professional Upload Area */
        .upload-section {
            text-align: center;
            padding: 30px;
            border: 2px dashed #464647;
            border-radius: 8px;
            background: #2d2d30;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #007acc;
            background: #333337;
        }
        
        .upload-section.dragover {
            border-color: #007acc;
            background: #333337;
        }
        
        .upload-section h3 {
            color: #cccccc;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 400;
        }
        
        .upload-section p {
            color: #969696;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }
        
        .file-input {
            display: none;
        }

        /* Professional Buttons */
        .btn {
            background: #0e639c;
            color: #ffffff;
            border: 1px solid #0e639c;
            padding: 6px 12px;
            border-radius: 2px;
            font-size: 0.8rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            background: #1177bb;
            border-color: #1177bb;
        }
        
        .btn-secondary {
            background: #3c3c3c;
            color: #cccccc;
            border: 1px solid #464647;
        }
        
        .btn-secondary:hover {
            background: #464647;
        }
        
        /* Toolbar Buttons */
        .toolbar-btn {
            background: transparent;
            border: 1px solid #464647;
            color: #cccccc;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .toolbar-btn:hover {
            background: #3c3c3c;
            border-color: #007acc;
            color: #ffffff;
        }
        
        .toolbar-btn.active {
            background: #0e639c;
            border-color: #0e639c;
            color: #ffffff;
        }
        
        .toolbar-separator {
            width: 1px;
            height: 20px;
            background: #464647;
            margin: 0 8px;
        }

        /* Professional Panels */
        .panel {
            border-bottom: 1px solid #464647;
        }
        
        .panel-header {
            background: #2d2d30;
            padding: 8px 15px;
            border-bottom: 1px solid #464647;
        }
        
        .panel-header h3 {
            font-size: 0.8rem;
            font-weight: 400;
            color: #cccccc;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .panel-content {
            padding: 15px;
        }

        /* Control Groups */
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #969696;
        }
        
        .slider {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #464647;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007acc;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007acc;
            cursor: pointer;
            border: none;
        }

        /* Canvas Styles */
        #imageCanvas {
            display: block;
            cursor: grab;
            transition: transform 0.1s ease;
        }
        
        #imageCanvas:active {
            cursor: grabbing;
        }

        /* Detection Cards */
        .detection-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        
        .detection-card {
            background: #2d2d30;
            border: 1px solid #464647;
            border-radius: 4px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .detection-card:hover {
            background: #3c3c3c;
            border-color: #007acc;
        }
        
        .detection-card.selected {
            background: #0e639c;
            border-color: #007acc;
            color: #ffffff;
        }
        
        .detection-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .detection-index {
            font-weight: 600;
            color: #007acc;
        }
        
        .detection-card.selected .detection-index {
            color: #ffffff;
        }
        
        .detection-type {
            background: #464647;
            color: #cccccc;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        
        .detection-card.selected .detection-type {
            background: rgba(255,255,255,0.2);
            color: #ffffff;
        }
        
        .confidence-section {
            margin-bottom: 8px;
        }
        
        .confidence-bar {
            width: 100%;
            height: 4px;
            background: #464647;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        
        .confidence-fill {
            height: 100%;
            background: #007acc;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .confidence-text {
            font-size: 0.7rem;
            color: #969696;
        }
        
        .detection-card.selected .confidence-text {
            color: rgba(255,255,255,0.8);
        }
        
        .detection-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.7rem;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            color: #969696;
            margin-bottom: 2px;
        }
        
        .detection-card.selected .detail-label {
            color: rgba(255,255,255,0.7);
        }
        
        .detail-value {
            color: #cccccc;
            font-weight: 500;
        }
        
        .detection-card.selected .detail-value {
            color: #ffffff;
        }

        /* Sorting Controls */
        .sort-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
        }
        
        .sort-select {
            flex: 1;
            background: #2d2d30;
            border: 1px solid #464647;
            color: #cccccc;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.8rem;
        }
        
        .sort-direction {
            background: #2d2d30;
            border: 1px solid #464647;
            color: #cccccc;
            padding: 4px 8px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .sort-direction:hover {
            background: #3c3c3c;
        }

        /* Loading and Error States */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #cccccc;
        }
        
        .spinner {
            border: 3px solid #464647;
            border-top: 3px solid #007acc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #3c1e1e;
            color: #ff6b6b;
            border: 1px solid #664647;
            padding: 15px;
            border-radius: 4px;
            margin: 15px;
            display: none;
            font-size: 0.8rem;
        }

        /* Highlight Animation */
        .detection-highlight {
            position: absolute;
            background: rgba(0, 122, 204, 0.3);
            border: 2px solid #007acc;
            pointer-events: none;
            animation: pulse 2s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        </style>
    </head>
    <body>
        <!-- Professional Architecture Tool Layout -->
        <div class="app-container">
            <!-- Top Header Bar -->
            <div class="header-bar">
                <div class="logo">FloorIA</div>
                <div class="project-info">
                    <span>FLOOR IA - Analyse Architecturale par IA</span>
                    <span>|</span>
                    <span id="projectStatus">Prêt</span>
                </div>
            </div>
            
            <!-- Upload and Controls -->
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <div class="error" id="errorMessage"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyse IA en cours...</p>
            </div>
            
            <!-- Main Workspace - Large Canvas Area -->
            <div class="main-workspace">
                <!-- Toolbar with Canvas Controls -->
                <div class="toolbar">
                    <button class="btn" onclick="document.getElementById('fileInput').click()">📁 Importer Plan</button>
                    <div class="toolbar-separator"></div>
                    <button class="toolbar-btn" id="zoomInBtn">🔍+</button>
                    <button class="toolbar-btn" id="zoomOutBtn">🔍-</button>
                    <button class="toolbar-btn" id="fitBtn">📐 Ajuster</button>
                    <div class="toolbar-separator"></div>
                    <button class="toolbar-btn active" id="selectBtn">👆 Sélection</button>
                    <button class="toolbar-btn" id="panBtn">✋ Déplacement</button>
                    <div class="toolbar-separator"></div>
                    <label style="color: #cccccc; font-size: 0.8rem;">Opacité:</label>
                    <input type="range" id="opacitySlider" class="slider" min="0" max="100" value="70" style="width: 100px;">
                    <span id="opacityValue" style="color: #cccccc; font-size: 0.8rem;">70%</span>
                    <button id="resetBtn" class="btn btn-secondary">Réinitialiser</button>
                </div>
                
                <!-- Large Canvas Workspace -->
                <div class="canvas-workspace" id="canvasContainer">
                    <canvas id="imageCanvas"></canvas>
                    <div class="canvas-overlay" id="visualizationSection" style="display: none;">
                        <!-- Canvas content will be here -->
                    </div>
                </div>
            </div>
            
            <!-- Right Sidebar - Properties & Data -->
            <div class="sidebar-right">
                <div class="panel">
                    <div class="panel-header">
                        <h3>Détections</h3>
                    </div>
                    <div class="panel-content">
                        <!-- Sorting Controls -->
                        <div class="sort-controls">
                            <select id="sortSelect" class="sort-select">
                                <option value="index">Index</option>
                                <option value="type">Type</option>
                                <option value="confidence">Confiance</option>
                                <option value="area">Surface</option>
                                <option value="perimeter">Périmètre</option>
                            </select>
                            <button id="sortDirection" class="sort-direction" title="Ordre de tri">↑</button>
                        </div>
                        
                        <!-- Detection Cards List -->
                        <div id="detectionList" class="detection-list">
                            <!-- Detection cards will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Professional Footer -->
            <div class="footer">
                <div class="footer-left">
                    <span><strong>FloorIA</strong> - Analyse Architecturale IA</span>
                </div>
                <div class="footer-center">
                    <div class="model-info">
                        <span id="modelName">Modèle: CubicASA5K-2</span>
                        <div class="model-metrics">
                            <span class="metric" id="mapMetric">mAP: --</span>
                            <span class="metric" id="precisionMetric">Précision: --</span>
                            <span class="metric" id="recallMetric">Rappel: --</span>
                        </div>
                    </div>
                </div>
                <div class="footer-right">
                    <span>Deep-5 et BTP Consultants</span>
                    <span>|</span>
                    <span>60 rue François 1er, 75008 PARIS</span>
                </div>
            </div>
        </div>
        
        <script src="main.js"></script>
    </body>
</html>
