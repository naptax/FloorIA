<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007acc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" fill="url(#faviconGradient)" rx="6"/>
  
  <!-- Floor plan representation -->
  <g transform="translate(4, 4)">
    <!-- Outer walls -->
    <rect x="2" y="2" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    
    <!-- Inner divisions -->
    <line x1="2" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="2" x2="12" y2="12" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Door opening -->
    <rect x="16" y="2" width="4" height="2" fill="url(#faviconGradient)"/>
    
    <!-- AI neural network nodes -->
    <circle cx="7" cy="7" r="2" fill="url(#aiAccent)" opacity="0.9"/>
    <circle cx="17" cy="7" r="2" fill="url(#aiAccent)" opacity="0.9"/>
    <circle cx="7" cy="17" r="2" fill="url(#aiAccent)" opacity="0.9"/>
    <circle cx="17" cy="17" r="2" fill="url(#aiAccent)" opacity="0.9"/>
    
    <!-- AI connection lines -->
    <line x1="7" y1="7" x2="17" y2="7" stroke="url(#aiAccent)" stroke-width="1" opacity="0.7"/>
    <line x1="7" y1="7" x2="7" y2="17" stroke="url(#aiAccent)" stroke-width="1" opacity="0.7"/>
    <line x1="17" y1="7" x2="17" y2="17" stroke="url(#aiAccent)" stroke-width="1" opacity="0.7"/>
    <line x1="7" y1="17" x2="17" y2="17" stroke="url(#aiAccent)" stroke-width="1" opacity="0.7"/>
    
    <!-- Central AI indicator -->
    <circle cx="12" cy="12" r="1" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
