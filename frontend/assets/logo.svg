<svg width="160" height="40" viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007acc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Architectural blueprint grid background -->
  <rect x="0" y="0" width="40" height="40" fill="url(#logoGradient)" rx="6"/>
  
  <!-- Floor plan representation -->
  <g transform="translate(5, 5)">
    <!-- Outer walls -->
    <rect x="3" y="3" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    
    <!-- Inner rooms/divisions -->
    <line x1="3" y1="15" x2="27" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="15" y1="3" x2="15" y2="15" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Door opening -->
    <rect x="20" y="3" width="4" height="2" fill="url(#logoGradient)"/>
    
    <!-- AI neural network nodes -->
    <circle cx="9" cy="9" r="2" fill="url(#aiGradient)" opacity="0.9"/>
    <circle cx="21" cy="9" r="2" fill="url(#aiGradient)" opacity="0.9"/>
    <circle cx="9" cy="21" r="2" fill="url(#aiGradient)" opacity="0.9"/>
    <circle cx="21" cy="21" r="2" fill="url(#aiGradient)" opacity="0.9"/>
    
    <!-- AI connection lines -->
    <line x1="9" y1="9" x2="21" y2="9" stroke="url(#aiGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="9" y1="9" x2="9" y2="21" stroke="url(#aiGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="21" y1="9" x2="21" y2="21" stroke="url(#aiGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="9" y1="21" x2="21" y2="21" stroke="url(#aiGradient)" stroke-width="1" opacity="0.7"/>
    
    <!-- Central AI indicator -->
    <circle cx="15" cy="15" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- FloorIA Text - Plus Grand -->
  <text x="50" y="18" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#ffffff">Floor</text>
  <text x="50" y="32" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="url(#aiGradient)">IA</text>
</svg>
